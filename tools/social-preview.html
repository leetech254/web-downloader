<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Downloader social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; background: #0b1020; }
    body { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .social-card {
      display: grid;
      width: 1200px;
      aspect-ratio: 40 / 21;
      grid-template-rows: auto 1fr auto;
      padding: 54px 68px 46px;
      overflow: hidden;
      color: #f4f6ff;
      background-color: #0b1020;
      background-image:
        linear-gradient(90deg, rgba(8, 13, 28, .12) 0%, rgba(8, 13, 28, .16) 54%, rgba(8, 13, 28, .02) 100%),
        linear-gradient(180deg, rgba(8, 13, 28, .12), rgba(8, 13, 28, .05)),
        url("social-background.jpg");
    background-position: center;
      background-size: 100% 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand img {
      display: block;
      width: 54px;
      height: 54px;
      border-radius: 15px;
    }
    .brand-copy { display: grid; gap: 4px; }
    .brand-name {
      color: #f4f6ff;
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -.4px;
    }
    .brand-credit {
      color: #b3c0e0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hero {
      display: grid;
      align-content: center;
      justify-items: start;
      max-width: 770px;
      padding: 12px 0 18px;
    }
    .eyebrow {
      margin: 0 0 15px;
      color: #c3ccff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.6px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #f8f9ff;
      font-size: 67px;
      font-weight: 760;
      letter-spacing: -3.8px;
      line-height: .99;
    }
    h1 span { color: #bdc8ff; }
    .description {
      max-width: 670px;
      margin: 19px 0 0;
      color: #c7d0e6;
      font-size: 19px;
      line-height: 1.45;
    }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(215, 223, 255, .22);
    }
    .formats {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }
    .format {
      padding: 7px 12px;
      border: 1px solid rgba(190, 202, 255, .34);
      border-radius: 999px;
      background: rgba(15, 24, 46, .55);
      color: #e2e7ff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.3px;
    }
    .signature {
      flex: none;
      color: #c4ccf4;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="social-card" aria-label="Media Downloader social preview">
    <header class="brand">
      <img src="../static/project-logo.svg" alt="">
      <div class="brand-copy">
        <span class="brand-name">Media Downloader</span>
        <span class="brand-credit">By Lee Tech</span>
      </div>
    </header>
    <section class="hero">
      <p class="eyebrow">Public media, made simple</p>
      <h1>Preview, then<br><span>save with confidence.</span></h1>
      <p class="description">Check supported public video, audio, and image links before saving. Only download media you have permission to use.</p>
    </section>
    <footer class="bottom">
      <div class="formats" aria-label="Media types">
        <span class="format">VIDEO</span>
        <span class="format">AUDIO</span>
        <span class="format">IMAGES</span>
      </div>
      <span class="signature">Use responsibly · Lee Tech</span>
    </footer>
  </main>
</body>
</html>
