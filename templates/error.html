<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32x32.png') }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}" sizes="180x180">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <title>Download error · Media Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">↓</span> Media Downloader</a></header>
    <section class="panel error-panel">
      <p class="eyebrow">Download not completed</p>
      <h1 class="error-title">We couldn't prepare this file.</h1>
      <div class="message message-error">{{ error }}</div>
      <p class="hint error-hint">Check that the media is public and the link points to a single item, then try again.</p>
      {% if code %}<p class="hint">Reference code: <code>{{ code }}</code></p>{% endif %}
      <p class="error-back"><a class="button button-primary" href="/">Back to downloader</a></p>
    </section>
    {% include "_footer.html" %}
  </main>
</body>
</html>
